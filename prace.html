
  <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasze Prace | Studio Tattoo</title>
    <!-- Logo na pasku w przeglądarce (Favicon) -->
    <link rel="icon" type="image/png" href="logo2.png">
    <style>
        :root {
            --bg-card: rgba(18, 38, 30, 0.88);
            --bg-nav: rgba(14, 28, 22, 0.95);
            --accent-green-bright: #52b788;
            --accent-green-hover: #74c69d;
            --accent-button: #2d6a4f;
            --text-light: #ffffff;
            --text-muted: #b7e4c7;
            --border-color: rgba(82, 183, 136, 0.3);
            --border-nav: rgba(82, 183, 136, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1d15;
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: linear-gradient(rgba(11, 29, 21, 0.75), rgba(11, 29, 21, 0.85)), 
                              url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Header / Nav */
        header {
            background-color: var(--bg-nav);
            border-bottom: 1px solid var(--border-nav);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
        }

        .logo-nav {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text-light);
            z-index: 1001;
        }

        .logo-nav img {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent-green-bright);
        }

        /* Hamburger button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .menu-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--text-light);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-green-bright);
        }

        .btn-green {
            background-color: var(--accent-button);
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            border: 1px solid var(--accent-green-bright);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn-green:hover {
            background-color: var(--accent-green-hover);
            color: #0b1d15;
            box-shadow: 0 0 20px rgba(82, 183, 136, 0.5);
            transform: translateY(-2px);
        }

        /* Gallery Section */
        .gallery-section {
            flex: 1;
            padding: 160px 2rem 80px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: var(--accent-green-bright);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .gallery-card {
            background-color: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-green-bright);
            box-shadow: 0 10px 30px rgba(82, 183, 136, 0.3);
        }

        .gallery-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }

        /* Footer */
        footer {
            background-color: rgba(7, 18, 13, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .footer-copy {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* RESPONSIVE MOBILE OVERLAY & STYLES */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0.8rem 1.2rem;
            }

            .logo-nav img {
                height: 50px;
            }

            .logo-text {
                font-size: 1.2rem;
            }

            .menu-toggle {
                display: flex;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background-color: rgba(11, 29, 21, 0.98);
                backdrop-filter: blur(15px);
                display: flex;
                justify-content: center;
                align-items: center;
                transition: right 0.4s ease;
                z-index: 1000;
            }

            nav.active {
                right: 0;
            }

            nav ul {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }

            nav a {
                font-size: 1.4rem;
            }

            .menu-toggle.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 6px);
            }
            .menu-toggle.active span:nth-child(2) {
                opacity: 0;
            }
            .menu-toggle.active span:nth-child(3) {
                transform: rotate(-45deg) translate(6px, -7px);
            }

            .gallery-section {
                padding: 130px 1.2rem 60px;
            }

            .section-title {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1.5rem;
            }

            .gallery-card img {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-nav">
                <img src="logo2.png" alt="Studio Tattoo Logo">
                <div class="logo-text">Studio <span>Tattoo</span></div>
            </a>
            
            <button class="menu-toggle" id="mobile-menu" aria-label="Otwórz menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html" class="nav-link">Strona Główna</a></li>
                    <li><a href="index.html#o-nas" class="nav-link">O nas</a></li>
                    <li><a href="prace.html" style="color: var(--accent-green-bright);" class="nav-link">Prace</a></li>
                    <li><a href="formularz.html" class="btn-green nav-link">Umów wizytę</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Gallery Content -->
    <main class="gallery-section">
        <div class="section-header">
            <h1 class="section-title">Galeria Prac</h1>
            <p class="section-subtitle">Odkryj wybrane realizacje oraz autorskie projekty wykonane w naszym studiu.</p>
        </div>

        <div class="gallery-grid">
            <div class="gallery-card">
                <img src="1.png" alt="Tatuaż 1">
            </div>
            <div class="gallery-card">
                <img src="2.png" alt="Tatuaż 2">
            </div>
            <div class="gallery-card">
                <img src="3.png" alt="Tatuaż 3">
            </div>
            <div class="gallery-card">
                <img src="4.png" alt="Tatuaż 4">
            </div>
            <div class="gallery-card">
                <img src="5.png" alt="Tatuaż 5">
            </div>
            <div class="gallery-card">
                <img src="6.png" alt="Tatuaż 6">
            </div>
            <div class="gallery-card">
                <img src="7.png" alt="Tatuaż 7">
            </div>
            <div class="gallery-card">
                <img src="8.png" alt="Tatuaż 8">
            </div>
            <div class="gallery-card">
                <img src="9.png" alt="Tatuaż 9">
            </div>
            <div class="gallery-card">
                <img src="10.png" alt="Tatuaż 10">
            </div>
            <div class="gallery-card">
                <img src="11.png" alt="Tatuaż 11">
            </div>
            <div class="gallery-card">
                <img src="12.png" alt="Tatuaż 12">
            </div>
            <div class="gallery-card">
                <img src="13.png" alt="Tatuaż 13">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-copy">
            &copy; 2026 Studio Tattoo. Wszelkie prawa zastrzeżone.
        </div>
    </footer>

    <!-- Skrypt obsługujący mobilną nakładkę menu -->
    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        const navLinks = document.querySelectorAll('.nav-link');

        mobileMenu.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
